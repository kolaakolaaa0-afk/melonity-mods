<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MELONITY // Mods Vault</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #131722;
      --panel-2: #191f2e;
      --border: rgba(255, 255, 255, 0.09);
      --text: #eef1f7;
      --muted: #8f98ad;
      --accent: #ff9f43;
      --ok: #2ed573;
      --warn: #ffa502;
      --bad: #ff4757;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .wrap { max-width: 1240px; margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .login-box { max-width: 480px; margin: 40px auto; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    h1 span { color: var(--accent); }
    p.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.45; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 720px) { .row, .row-3 { grid-template-columns: 1fr; } }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 64px; resize: vertical; }
    button {
      background: var(--accent); color: #0b0d12; border: none; border-radius: 8px;
      padding: 9px 14px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    button.sec { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    button.ok { background: rgba(46, 213, 115, 0.16); color: var(--ok); border: 1px solid rgba(46, 213, 115, 0.35); }
    button.bad { background: rgba(255, 71, 87, 0.16); color: var(--bad); border: 1px solid rgba(255, 71, 87, 0.35); }
    button.sm { padding: 6px 10px; font-size: 12px; }
    .hidden { display: none !important; }
    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 18px;
    }
    .badge { padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .b-owner { background: rgba(255, 159, 67, 0.2); color: var(--accent); }
    .b-admin { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .b-author { background: rgba(46, 213, 115, 0.16); color: var(--ok); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .tab.active { outline: 2px solid var(--accent); }
    .grid-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 14px; }
    .mod-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .p-ok { background: rgba(46, 213, 115, 0.15); color: var(--ok); }
    .p-wait { background: rgba(255, 165, 2, 0.15); color: var(--warn); }
    .p-no { background: rgba(255, 71, 87, 0.15); color: var(--bad); }
    .meta { font-size: 12px; color: var(--muted); background: rgba(0, 0, 0, 0.25); padding: 10px; border-radius: 8px; margin: 10px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    code { background: rgba(255, 255, 255, 0.07); padding: 2px 6px; border-radius: 5px; color: var(--accent); }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none;
      align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-bg.open { display: flex; }
    .modal { max-width: 760px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .msg { font-size: 13px; margin-top: 12px; color: var(--warn); }
  </style>
</head>
<body>

<div id="loginView" class="card login-box">
  <h1>MELONITY <span>MODS VAULT</span></h1>
  <p class="sub">
    Открытый файл: <code>mods.json</code><br>
    Зашифрованные базы: <code>vault_mods.json</code> и <code>vault_keys.json</code>
  </p>

  <div class="field">
    <label>GitHub Personal Access Token (права Contents: Read & Write)</label>
    <input type="password" id="ghToken" placeholder="github_pat_..." />
  </div>

  <div class="field">
    <label>Мастер-ключ шифрования (.json баз)</label>
    <input type="password" id="encSecret" placeholder="Пароль для шифрования/расшифровки" />
  </div>

  <div class="field">
    <label>Ваш ключ доступа (Автор / Админ / Владелец)</label>
    <input type="password" id="userKey" placeholder="Например: OWNER-MELONITY-2026" />
  </div>

  <div class="actions">
    <button onclick="connectVault(false)" style="flex:1;">Войти</button>
    <button class="sec" onclick="connectVault(true)">Создать базы (первый запуск)</button>
  </div>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="appView" class="wrap hidden">
  <div class="card">
    <header>
      <div>
        <strong>MELONITY MODS</strong>
        <span id="roleBadge" class="badge"></span>
        <span id="userLabel" style="margin-left:8px; font-size:13px; color:var(--muted);"></span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a id="rawModsLink" href="https://raw.githubusercontent.com/kolaakolaaa0-afk/launcher_meloniry_server/main/mods.json" target="_blank" class="sec" style="text-decoration:none; padding:6px 10px; border-radius:8px; font-size:12px; display:inline-flex; align-items:center;">Открыть mods.json</a>
        <button id="btnSaveGh" onclick="publishAll()">Сохранить на GitHub</button>
        <button class="bad sm" onclick="logout()">Выйти</button>
      </div>
    </header>

    <div class="tabs">
      <button id="tabMods" class="tab active" onclick="setTab('mods')">Модификации</button>
      <button id="tabKeys" class="tab hidden" onclick="setTab('keys')">Ключи доступа</button>
      <button id="btnAddMod" onclick="openEditor()" style="margin-left:auto;">+ Добавить мод</button>
    </div>

    <div id="viewMods">
      <div id="modsList" class="grid-mods"></div>
    </div>

    <div id="viewKeys" class="hidden">
      <div class="row-3">
        <div class="field">
          <label>Имя / Никнейм</label>
          <input id="kName" placeholder="Cody_Mansory" />
        </div>
        <div class="field">
          <label>Роль</label>
          <select id="kRole">
            <option value="author">author (Автор)</option>
            <option value="admin">admin (Админ)</option>
            <option value="owner">owner (Владелец)</option>
          </select>
        </div>
        <div class="field">
          <label>Ключ (оставь пустым для автогенерации)</label>
          <div style="display:flex; gap:8px;">
            <input id="kValue" placeholder="AUTHOR-XXXX" />
            <button onclick="addKey()">Создать</button>
          </div>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Имя</th><th>Ключ</th><th>Роль</th><th></th></tr>
        </thead>
        <tbody id="keysTbody"></tbody>
      </table>
    </div>
    <div id="appMsg" class="msg"></div>
  </div>
</div>

<div id="editorModal" class="modal-bg">
  <div class="card modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 id="edTitle" style="font-size:17px;">Модификация</h2>
      <button class="sec sm" onclick="closeEditor()">✕</button>
    </div>
    <input type="hidden" id="edIsEdit" value="0" />
    <div class="row-3">
      <div class="field"><label>id *</label><input id="m_id" placeholder="enb-files" /></div>
      <div class="field"><label>category</label><input id="m_category" value="graphics" /></div>
      <div class="field"><label>sizeBytes</label><input type="number" id="m_sizeBytes" value="0" /></div>
    </div>
    <div class="row">
      <div class="field"><label>name *</label><input id="m_name" placeholder="ENB Files" /></div>
      <div class="field"><label>nameRu</label><input id="m_nameRu" placeholder="Файлы ENB" /></div>
      <div class="field"><label>nameUk</label><input id="m_nameUk" placeholder="Файли ENB" /></div>
      <div class="field"><label>nameEn</label><input id="m_nameEn" placeholder="ENB Files" /></div>
    </div>
    <div class="row">
      <div class="field"><label>description</label><textarea id="m_description"></textarea></div>
      <div class="field"><label>descriptionRu</label><textarea id="m_descriptionRu"></textarea></div>
      <div class="field"><label>descriptionUk</label><textarea id="m_descriptionUk"></textarea></div>
      <div class="field"><label>descriptionEn</label><textarea id="m_descriptionEn"></textarea></div>
    </div>
    <div class="row">
      <div class="field"><label>downloadUrl *</label><input id="m_downloadUrl" placeholder="https://raw.githubusercontent.com/..." /></div>
      <div class="field"><label>sourceUrl</label><input id="m_sourceUrl" placeholder="https://github.com/..." /></div>
      <div class="field"><label>source</label><input id="m_source" value="launcher_meloniry_server" /></div>
      <div class="field"><label>authors (через запятую)</label><input id="m_authors" /></div>
    </div>
    <div class="row-3">
      <div class="field"><label>authorLinks (через запятую)</label><input id="m_authorLinks" /></div>
      <div class="field"><label>dependencies (через запятую)</label><input id="m_dependencies" /></div>
      <div class="field"><label>imageUrls (через запятую)</label><input id="m_imageUrls" /></div>
    </div>
    <div style="display:flex; gap:18px; flex-wrap:wrap; margin:8px 0 16px; font-size:13px;">
      <label style="display:flex; align-items:center; gap:6px; color:var(--text);"><input type="checkbox" id="m_isProjectMod" checked style="width:auto;"> isProjectMod</label>
      <label style="display:flex; align-items:center; gap:6px; color:var(--text);"><input type="checkbox" id="m_isNew" checked style="width:auto;"> isNew</label>
      <label id="m_isVerified_wrap" class="hidden" style="display:flex; align-items:center; gap:6px; color:var(--text);"><input type="checkbox" id="m_isVerified" style="width:auto;"> isVerified</label>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="sec" onclick="closeEditor()">Отмена</button>
      <button onclick="saveModLocal()">Применить</button>
    </div>
  </div>
</div>

<script>
// === НАСТРОЙКИ РЕПОЗИТОРИЯ И ПРЯМАЯ ССЫЛКА ===
const MODS_JSON_URL = 'https://raw.githubusercontent.com/kolaakolaaa0-afk/launcher_meloniry_server/main/mods.json';
const GH_OWNER  = 'kolaakolaaa0-afk';
const GH_REPO   = 'launcher_meloniry_server';
const GH_BRANCH = 'main';

const VAULT_MODS_FILE  = 'vault_mods.json';
const VAULT_KEYS_FILE  = 'vault_keys.json';
const PUBLIC_MODS_FILE = 'mods.json';

let session = { token: '', secret: '', userKey: '' };
let me = null;
let keysDb = [];
let modsDb = [];

document.getElementById('rawModsLink').href = MODS_JSON_URL;

// === ШИФРОВАНИЕ В JSON-КОНТЕЙНЕР (AES-GCM 256) ===
function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function b64ToBuf(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveAesKey(password, salt) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptToJsonContainer(dataObj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt);
  const plainBytes = new TextEncoder().encode(JSON.stringify(dataObj));
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);

  return JSON.stringify({
    alg: 'AES-GCM',
    kdf: 'PBKDF2-SHA256',
    iter: 150000,
    salt: bufToB64(salt),
    iv: bufToB64(iv),
    data: bufToB64(cipherBuf)
  }, null, 2);
}

async function decryptFromJsonContainer(jsonStr, password) {
  const box = JSON.parse(jsonStr);
  if (!box || !box.salt || !box.iv || !box.data) {
    throw new Error('Неверный формат зашифрованного JSON');
  }
  const salt = b64ToBuf(box.salt);
  const iv = b64ToBuf(box.iv);
  const cipher = b64ToBuf(box.data);
  const key = await deriveAesKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// === РАБОТА С GITHUB API ===
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  return bufToB64(bytes);
}

function b64ToUtf8(b64) {
  const bytes = b64ToBuf(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(bytes);
}

async function ghReadFile(path) {
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}&t=${Date.now()}`;
  const headers = { 'Accept': 'application/vnd.github+json' };
  if (session.token) headers['Authorization'] = `Bearer ${session.token}`;

  const res = await fetch(url, { headers });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Ошибка чтения ${path}: HTTP ${res.status}`);

  const json = await res.json();
  return {
    content: b64ToUtf8(json.content),
    sha: json.sha
  };
}

async function ghWriteFile(path, contentStr, commitMsg) {
  if (!session.token) throw new Error('Не указан GitHub Token');

  const existing = await ghReadFile(path);
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`;
  const body = {
    message: commitMsg,
    content: utf8ToB64(contentStr),
    branch: GH_BRANCH
  };
  if (existing && existing.sha) body.sha = existing.sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${session.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`Ошибка записи ${path}: ${err.message || res.status}`);
  }
}

function generatePublicModsJson() {
  const approvedMods = modsDb
    .filter(m => Boolean(m.isVerified))
    .map(m => {
      const { _ownerKey, _status, _rejectReason, ...cleanMod } = m;
      return cleanMod;
    });
  return JSON.stringify({ mods: approvedMods }, null, 2);
}

// === АВТОРИЗАЦИЯ И ИНИЦИАЛИЗАЦИЯ ===
async function connectVault(isInit) {
  const msg = document.getElementById('loginMsg');
  msg.textContent = 'Подключение к GitHub...';

  session.token   = document.getElementById('ghToken').value.trim();
  session.secret  = document.getElementById('encSecret').value;
  session.userKey = document.getElementById('userKey').value.trim();

  if (!session.secret || !session.userKey) {
    msg.textContent = 'Введите мастер-ключ шифрования и ваш ключ доступа';
    return;
  }

  try {
    let keysFile = await ghReadFile(VAULT_KEYS_FILE);
    let modsFile = await ghReadFile(VAULT_MODS_FILE);

    if (isInit) {
      if (!session.token) throw new Error('Для создания баз нужен GitHub Token');
      if (keysFile || modsFile) throw new Error('Базы vault_keys.json / vault_mods.json уже существуют в репозитории');

      const initKeys = [{ key: session.userKey, role: 'owner', name: 'Владелец' }];
      let initMods = [];

      // Импортируем существующие моды из публичного mods.json
      const pubRes = await fetch(`${MODS_JSON_URL}?t=${Date.now()}`);
      if (pubRes.ok) {
        const pubJson = await pubRes.json();
        if (Array.isArray(pubJson.mods)) {
          initMods = pubJson.mods.map(m => ({
            ...m,
            _ownerKey: session.userKey,
            _status: m.isVerified ? 'approved' : 'pending'
          }));
        }
      }

      await ghWriteFile(VAULT_KEYS_FILE, await encryptToJsonContainer(initKeys, session.secret), 'Init vault_keys.json');
      await ghWriteFile(VAULT_MODS_FILE, await encryptToJsonContainer(initMods, session.secret), 'Init vault_mods.json');

      keysFile = await ghReadFile(VAULT_KEYS_FILE);
      modsFile = await ghReadFile(VAULT_MODS_FILE);
    }

    if (!keysFile) throw new Error('Файл vault_keys.json не найден. Нажмите «Создать базы (первый запуск)».');

    keysDb = await decryptFromJsonContainer(keysFile.content, session.secret);
    me = keysDb.find(k => k.key === session.userKey);
    if (!me) throw new Error('Неверный ключ доступа');

    modsDb = modsFile ? await decryptFromJsonContainer(modsFile.content, session.secret) : [];

    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    document.getElementById('userLabel').textContent = me.name;

    const badge = document.getElementById('roleBadge');
    badge.textContent = me.role;
    badge.className = `badge b-${me.role}`;

    if (me.role === 'owner') {
      document.getElementById('tabKeys').classList.remove('hidden');
      document.getElementById('m_isVerified_wrap').classList.remove('hidden');
      renderKeys();
    }
    if (me.role === 'admin') {
      document.getElementById('btnAddMod').classList.add('hidden');
    }

    renderMods();
    msg.textContent = '';
  } catch (err) {
    msg.textContent = err.message || 'Ошибка расшифровки (проверь мастер-пароль)';
  }
}

function logout() {
  location.reload();
}

function setTab(tab) {
  document.getElementById('viewMods').classList.toggle('hidden', tab !== 'mods');
  document.getElementById('viewKeys').classList.toggle('hidden', tab !== 'keys');
  document.getElementById('tabMods').classList.toggle('active', tab === 'mods');
  document.getElementById('tabKeys').classList.toggle('active', tab === 'keys');
}

// === РЕНДЕР И УПРАВЛЕНИЕ МОДАМИ ===
function renderMods() {
  const container = document.getElementById('modsList');
  const list = me.role === 'author'
    ? modsDb.filter(m => m._ownerKey === me.key)
    : modsDb;

  if (!list.length) {
    container.innerHTML = '<p style="color:var(--muted);">Модификаций пока нет.</p>';
    return;
  }

  container.innerHTML = list.map(m => {
    const statusPill = m.isVerified
      ? '<span class="pill p-ok">Верифицирован</span>'
      : (m._status === 'rejected'
        ? `<span class="pill p-no">Отклонён: ${m._rejectReason || ''}</span>`
        : '<span class="pill p-wait">На проверке</span>');

    let actions = '';
    if (me.role === 'owner' || (me.role === 'author' && m._ownerKey === me.key)) {
      actions += `<button class="sec sm" onclick="openEditor('${m.id}')">Изменить</button>`;
    }
    if (me.role === 'admin' || me.role === 'owner') {
      if (!m.isVerified) {
        actions += `<button class="ok sm" onclick="moderate('${m.id}', 'approve')">Одобрить</button>`;
      }
      actions += `<button class="sec sm" onclick="moderate('${m.id}', 'reject')">Отклонить</button>`;
    }
    if (me.role === 'owner') {
      actions += `<button class="bad sm" onclick="deleteMod('${m.id}')">Удалить</button>`;
    }

    return `
      <div class="card">
        <div class="mod-top">
          <div>
            <strong>${m.nameRu || m.name}</strong>
            <div style="font-size:11px; color:var(--muted);"><code>${m.id}</code> • ${m.category || 'other'}</div>
          </div>
          ${statusPill}
        </div>
        <div style="font-size:13px; color:#cbd2e0;">${m.descriptionRu || m.description || ''}</div>
        <div class="meta">
          <div><b>Авторы:</b> ${(m.authors || []).join(', ')}</div>
          <div><b>Размер:</b> ${m.sizeBytes || 0} B</div>
          <div style="word-break:break-all;"><b>URL:</b> ${m.downloadUrl || ''}</div>
        </div>
        <div class="actions">${actions}</div>
      </div>
    `;
  }).join('');
}

function openEditor(id = null) {
  const isEdit = Boolean(id);
  document.getElementById('edIsEdit').value = isEdit ? '1' : '0';
  document.getElementById('edTitle').textContent = isEdit ? `Редактировать: ${id}` : 'Добавить модификацию';
  const idInput = document.getElementById('m_id');
  idInput.disabled = isEdit;

  if (isEdit) {
    const m = modsDb.find(x => x.id === id);
    if (!m) return;
    idInput.value = m.id;
    document.getElementById('m_category').value = m.category || 'other';
    document.getElementById('m_sizeBytes').value = m.sizeBytes || 0;
    document.getElementById('m_name').value = m.name || '';
    document.getElementById('m_nameRu').value = m.nameRu || '';
    document.getElementById('m_nameUk').value = m.nameUk || '';
    document.getElementById('m_nameEn').value = m.nameEn || '';
    document.getElementById('m_description').value = m.description || '';
    document.getElementById('m_descriptionRu').value = m.descriptionRu || '';
    document.getElementById('m_descriptionUk').value = m.descriptionUk || '';
    document.getElementById('m_descriptionEn').value = m.descriptionEn || '';
    document.getElementById('m_downloadUrl').value = m.downloadUrl || '';
    document.getElementById('m_sourceUrl').value = m.sourceUrl || '';
    document.getElementById('m_source').value = m.source || 'launcher_meloniry_server';
    document.getElementById('m_authors').value = (m.authors || []).join(', ');
    document.getElementById('m_authorLinks').value = (m.authorLinks || []).join(', ');
    document.getElementById('m_dependencies').value = (m.dependencies || []).join(', ');
    document.getElementById('m_imageUrls').value = (m.imageUrls || []).join(', ');
    document.getElementById('m_isProjectMod').checked = Boolean(m.isProjectMod);
    document.getElementById('m_isNew').checked = Boolean(m.isNew);
    document.getElementById('m_isVerified').checked = Boolean(m.isVerified);
  } else {
    document.querySelectorAll('#editorModal input[type="text"], #editorModal textarea').forEach(el => {
      if (el.id !== 'm_source' && el.id !== 'm_category') el.value = '';
    });
    document.getElementById('m_sizeBytes').value = 0;
    document.getElementById('m_authors').value = me.name;
    document.getElementById('m_isProjectMod').checked = true;
    document.getElementById('m_isNew').checked = true;
    document.getElementById('m_isVerified').checked = (me.role === 'owner');
  }

  document.getElementById('editorModal').classList.add('open');
}

function closeEditor() {
  document.getElementById('editorModal').classList.remove('open');
}

function parseCsv(val) {
  return val.split(',').map(s => s.trim()).filter(Boolean);
}

function saveModLocal() {
  const isEdit = document.getElementById('edIsEdit').value === '1';
  const id = document.getElementById('m_id').value.trim();
  const name = document.getElementById('m_name').value.trim();
  if (!id || !name) return alert('Заполни обязательные поля id и name');

  const idx = modsDb.findIndex(x => x.id === id);
  if (!isEdit && idx !== -1) return alert('Модификация с таким id уже существует');

  const prev = isEdit ? modsDb[idx] : null;
  if (isEdit && me.role === 'author' && prev._ownerKey !== me.key) {
    return alert('Вы можете изменять только свои модификации');
  }

  const verified = (me.role === 'owner')
    ? document.getElementById('m_isVerified').checked
    : false;

  const modObj = {
    id,
    name,
    nameRu: document.getElementById('m_nameRu').value.trim() || name,
    nameUk: document.getElementById('m_nameUk').value.trim() || name,
    nameEn: document.getElementById('m_nameEn').value.trim() || name,
    description: document.getElementById('m_description').value.trim(),
    descriptionRu: document.getElementById('m_descriptionRu').value.trim(),
    descriptionUk: document.getElementById('m_descriptionUk').value.trim(),
    descriptionEn: document.getElementById('m_descriptionEn').value.trim(),
    isProjectMod: document.getElementById('m_isProjectMod').checked,
    isNew: document.getElementById('m_isNew').checked,
    isVerified: verified,
    category: document.getElementById('m_category').value.trim() || 'other',
    dependencies: parseCsv(document.getElementById('m_dependencies').value),
    authors: parseCsv(document.getElementById('m_authors').value),
    authorLinks: parseCsv(document.getElementById('m_authorLinks').value),
    source: document.getElementById('m_source').value.trim() || 'launcher_meloniry_server',
    sourceUrl: document.getElementById('m_sourceUrl').value.trim(),
    sizeBytes: parseInt(document.getElementById('m_sizeBytes').value, 10) || 0,
    downloadUrl: document.getElementById('m_downloadUrl').value.trim(),
    imageUrls: parseCsv(document.getElementById('m_imageUrls').value),
    _ownerKey: isEdit ? prev._ownerKey : me.key,
    _status: verified ? 'approved' : 'pending'
  };

  if (isEdit) modsDb[idx] = modObj;
  else modsDb.push(modObj);

  closeEditor();
  renderMods();
  document.getElementById('appMsg').textContent = 'Есть несохранённые изменения — нажми «Сохранить на GitHub».';
}

function moderate(id, decision) {
  const m = modsDb.find(x => x.id === id);
  if (!m) return;

  if (decision === 'approve') {
    m.isVerified = true;
    m._status = 'approved';
    delete m._rejectReason;
  } else {
    m.isVerified = false;
    m._status = 'rejected';
    m._rejectReason = prompt('Причина отклонения:') || 'Не прошло проверку';
  }

  renderMods();
  document.getElementById('appMsg').textContent = 'Статус обновлён — нажми «Сохранить на GitHub».';
}

function deleteMod(id) {
  if (me.role !== 'owner') return;
  if (!confirm(`Удалить модификацию "${id}"?`)) return;

  modsDb = modsDb.filter(x => x.id !== id);
  renderMods();
  document.getElementById('appMsg').textContent = 'Удалено — нажми «Сохранить на GitHub».';
}

// === УПРАВЛЕНИЕ КЛЮЧАМИ (ТОЛЬКО ВЛАДЕЛЕЦ) ===
function renderKeys() {
  document.getElementById('keysTbody').innerHTML = keysDb.map(k => `
    <tr>
      <td>${k.name}</td>
      <td><code>${k.key}</code></td>
      <td><span class="badge b-${k.role}">${k.role}</span></td>
      <td>${k.key !== me.key ? `<button class="bad sm" onclick="deleteKey('${k.key}')">Удалить</button>` : 'Текущий'}</td>
    </tr>
  `).join('');
}

function addKey() {
  if (me.role !== 'owner') return;
  const name = document.getElementById('kName').value.trim() || 'Пользователь';
  const role = document.getElementById('kRole').value;
  const custom = document.getElementById('kValue').value.trim();
  const keyVal = custom || `${role.toUpperCase()}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;

  if (keysDb.some(x => x.key === keyVal)) return alert('Такой ключ уже существует');
  keysDb.push({ key: keyVal, role, name });
  document.getElementById('kValue').value = '';
  renderKeys();
  document.getElementById('appMsg').textContent = 'Ключ добавлен — нажми «Сохранить на GitHub».';
}

function deleteKey(keyVal) {
  if (me.role !== 'owner' || keyVal === me.key) return;
  keysDb = keysDb.filter(x => x.key !== keyVal);
  renderKeys();
  document.getElementById('appMsg').textContent = 'Ключ удалён — нажми «Сохранить на GitHub».';
}

// === СОХРАНЕНИЕ ВСЕХ .JSON ФАЙЛОВ НА GITHUB ===
async function publishAll() {
  const msg = document.getElementById('appMsg');
  const btn = document.getElementById('btnSaveGh');
  btn.disabled = true;
  msg.textContent = 'Шифрование и загрузка на GitHub...';

  try {
    await ghWriteFile(VAULT_MODS_FILE, await encryptToJsonContainer(modsDb, session.secret), 'Update vault_mods.json');
    await ghWriteFile(PUBLIC_MODS_FILE, generatePublicModsJson(), 'Sync mods.json');

    if (me.role === 'owner') {
      await ghWriteFile(VAULT_KEYS_FILE, await encryptToJsonContainer(keysDb, session.secret), 'Update vault_keys.json');
    }

    msg.textContent = 'Готово! mods.json и зашифрованные .json файлы обновлены в репозитории.';
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
